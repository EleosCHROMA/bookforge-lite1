name: Build v3 engineering candidate
on:
  workflow_dispatch:
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r bookforge_v3/requirements.txt
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
      - name: Test v2
        working-directory: bookforge_v2
        run: python -m unittest discover -s tests -q
      - name: Test v3
        run: python -m unittest discover -s bookforge_v3/tests -q
      - name: Build both complete candidates and review reports
        run: python -m bookforge_v3.candidate --output v3-candidate
      - uses: actions/upload-artifact@v4
        with:
          name: mistake-mechanics-v3-candidate
          path: v3-candidate/
