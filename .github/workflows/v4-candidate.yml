name: Build v4 development candidate
on:
  workflow_dispatch:
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r bookforge_v4/requirements.txt
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
      - name: Test v2
        working-directory: bookforge_v2
        run: python -m unittest discover -s tests -q
      - name: Test v3
        run: python -m unittest discover -s bookforge_v3/tests -q
      - name: Test v4
        run: python -m unittest discover -s bookforge_v4/tests -q
      - name: Build diagrams, models, review packet and print reports
        run: python -m bookforge_v4.candidate --output v4-candidate
      - uses: actions/upload-artifact@v4
        with:
          name: mistake-mechanics-v4-development-candidate
          path: v4-candidate/
