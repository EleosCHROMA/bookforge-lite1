name: BookForge v3 tests

on:
  push:
    branches: [version-3]
  pull_request:
    branches: [version-3]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r bookforge_v3/requirements.txt
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
      - name: Test v2
        working-directory: bookforge_v2
        run: python -m unittest discover -s tests -v
      - name: Test v3
        run: python -m unittest discover -s bookforge_v3/tests -v
      - name: Generate v3 workbooks
        run: |
          python bookforge_v3/pipeline.py bookforge_v3/data/mistake_mechanics_six_chapters.json --theme clean-premium --output clean.pdf
          python bookforge_v3/pipeline.py bookforge_v3/data/mistake_mechanics_six_chapters.json --theme playful-illustrated --output playful.pdf
      - name: Expand to 108 draft exercises
        run: |
          python -m bookforge_v3.expand_workbook bookforge_v3/data/mistake_mechanics_six_chapters.json --output draft108.json
          python bookforge_v3/pipeline.py draft108.json --theme clean-premium --output clean-108.pdf
          python bookforge_v3/pipeline.py draft108.json --theme playful-illustrated --output playful-108.pdf
      - name: KDP structural preflight
        run: |
          python bookforge_v3/kdp_preflight.py clean-108.pdf
          python bookforge_v3/kdp_preflight.py playful-108.pdf
      - name: Build enriched fraction-division draft
        run: |
          python -m bookforge_v3.build_120 bookforge_v3/data/mistake_mechanics_six_chapters.json --output draft120.json
          python bookforge_v3/pipeline.py draft120.json --theme clean-premium --output clean-120.pdf
          python bookforge_v3/pipeline.py draft120.json --theme playful-illustrated --output playful-120.pdf
          python bookforge_v3/kdp_preflight.py clean-120.pdf
          python bookforge_v3/kdp_preflight.py playful-120.pdf
      - name: Insert visual teaching pages before answer keys
        run: |
          python -m bookforge_v3.visual_book playful-120.pdf --output playful-visual-120.pdf
          python -m bookforge_v3.visual_book clean-120.pdf --output clean-visual-120.pdf
          python bookforge_v3/kdp_preflight.py playful-visual-120.pdf
          python bookforge_v3/kdp_preflight.py clean-visual-120.pdf
      - name: Generate 132-question contextual drafts
        run: |
          python -m bookforge_v3.build_132 bookforge_v3/data/mistake_mechanics_six_chapters.json --output draft132.json
          python bookforge_v3/pipeline.py draft132.json --theme clean-premium --output clean-132.pdf
          python bookforge_v3/pipeline.py draft132.json --theme playful-illustrated --output playful-132.pdf
          python bookforge_v3/kdp_preflight.py clean-132.pdf
          python bookforge_v3/kdp_preflight.py playful-132.pdf
      - name: Generate editable guided-lesson workbook in both themes
        run: |
          python -m bookforge_v3.build_guided bookforge_v3/data/mistake_mechanics_six_chapters.json --lessons bookforge_v3/data/guided_lessons.json --theme clean-premium --output guided-clean.pdf
          python -m bookforge_v3.build_guided bookforge_v3/data/mistake_mechanics_six_chapters.json --lessons bookforge_v3/data/guided_lessons.json --theme playful-illustrated --output guided-playful.pdf
      - name: Build 132-question native-numbered books and review inventory
        run: |
          python -m bookforge_v3.native_book draft132.json --lessons bookforge_v3/data/guided_lessons.json --theme clean-premium --output final-clean-132.pdf
          python -m bookforge_v3.native_book draft132.json --lessons bookforge_v3/data/guided_lessons.json --theme playful-illustrated --output final-playful-132.pdf
          python -m bookforge_v3.review_queue draft132.json --output draft132-review-queue.json
          python bookforge_v3/kdp_preflight.py final-clean-132.pdf
          python bookforge_v3/kdp_preflight.py final-playful-132.pdf
      - name: Generate blocked-release QA report
        run: |
          python -m bookforge_v3.release_gate draft132.json --pdf final-clean-132.pdf --output release-blockers.json || test $? -eq 1
          python -c "import json; r=json.load(open('release-blockers.json')); assert not r['ready_for_release']; assert r['blockers']"
      - name: Generate matching 60-page paperback cover drafts
        run: |
          python -m bookforge_v3.cover_draft --pages 60 --theme playful-illustrated --output cover-playful-draft.pdf
          python -m bookforge_v3.cover_draft --pages 60 --theme clean-premium --output cover-clean-draft.pdf
      - name: Build covers from the final interior page count
        run: |
          python -m bookforge_v3.cover_pipeline --interior final-playful-132.pdf --config bookforge_v3/data/cover_config.json --output matched-playful-cover.pdf --report matched-cover-report.json
          python -m bookforge_v3.paired_cover_preflight --interior final-playful-132.pdf --cover matched-playful-cover.pdf --report paired-cover-preflight.json
          python -c "import json; d=json.load(open('paired-cover-preflight.json')); assert d['ok']"
      - name: Export standards review report
        run: |
          python -m bookforge_v3.curriculum_report draft108.json --output standards-review.json
      - uses: actions/upload-artifact@v4
        with:
          name: bookforge-v3-samples
          path: |
            clean.pdf
            playful.pdf
            clean-108.pdf
            playful-108.pdf
            draft108.json
            draft120.json
            clean-120.pdf
            playful-120.pdf
            playful-visual-120.pdf
            clean-visual-120.pdf
            standards-review.json
            guided-clean.pdf
            guided-playful.pdf
            final-clean-132.pdf
            final-playful-132.pdf
            draft132-review-queue.json
            release-blockers.json
            cover-playful-draft.pdf
            cover-clean-draft.pdf
            matched-playful-cover.pdf
            matched-cover-report.json
            paired-cover-preflight.json
            draft132.json
            clean-132.pdf
            playful-132.pdf
