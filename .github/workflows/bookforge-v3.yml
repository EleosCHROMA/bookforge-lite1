name: BookForge v3 tests

on:
  push:
    branches: [version-3]
  pull_request:
    branches: [version-3]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r bookforge_v2/requirements.txt
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
      - name: Test v2
        working-directory: bookforge_v2
        run: python -m unittest discover -s tests -v
      - name: Test v3
        run: python -m unittest discover -s bookforge_v3/tests -v
      - name: Generate v3 workbooks
        run: |
          python bookforge_v3/pipeline.py bookforge_v3/data/mistake_mechanics_six_chapters.json --theme clean-premium --output clean.pdf
          python bookforge_v3/pipeline.py bookforge_v3/data/mistake_mechanics_six_chapters.json --theme playful-illustrated --output playful.pdf
      - name: Expand to 108 draft exercises
        run: |
          python -m bookforge_v3.expand_workbook bookforge_v3/data/mistake_mechanics_six_chapters.json --output draft108.json
          python bookforge_v3/pipeline.py draft108.json --theme clean-premium --output clean-108.pdf
          python bookforge_v3/pipeline.py draft108.json --theme playful-illustrated --output playful-108.pdf
      - name: KDP structural preflight
        run: |
          python bookforge_v3/kdp_preflight.py clean-108.pdf
          python bookforge_v3/kdp_preflight.py playful-108.pdf
      - name: Export standards review report
        run: |
          python -m bookforge_v3.curriculum_report draft108.json --output standards-review.json
      - uses: actions/upload-artifact@v4
        with:
          name: bookforge-v3-samples
          path: |
            clean.pdf
            playful.pdf
            clean-108.pdf
            playful-108.pdf
            draft108.json
            standards-review.json
